<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>list</title>
</head>
<body>
  <!--unordered list-->
  <ul>
    <li>bread</li>
    <li>milk</li>
  </ul>

  <!--ordered list-->
  <ol>
    <li>wake up</li>
    <li>eat</li>
    <li>sleep</li>
  </ol>

  <!--description list-->
  <dl>
    <dt>Syrax</dt>
    <dd>Dragon of rhaneyra targayrean</dd>   <!--description defnition-->
  </dl>
</body>
</html>
